              // 🏢 全銀協 支店名API連携（支店コード自動補完・銀行名連動）
              setupBranchApiSearchField(q, container, val);
            } else if (apiConfig && apiConfig.isBranchCode) {
              // 🔢 全銀協 支店番号API連携（支店名自動補完・銀行名連動・検索候補出力）
              setupBranchCodeApiSearchField(q, container, val);
            } else {
              const input = document.createElement('input');
              input.type = 'text';
              input.className = 'form-control';
              input.placeholder = '回答を入力...';
              input.value = val || '';

              // 金融機関コード・支店番号・郵便番号・口座名義（カナ）の自動逆引き・補完ハンドラ
              const isBankCode = q.title && (q.title.includes('金融機関コード') || (q.title.includes('銀行') && q.title.includes('コード')));
              const isBranchCode = q.title && (q.title.includes('支店番号') || q.title.includes('支店コード') || (q.title.includes('店舗コード') || (q.title.includes('支店') && q.title.includes('番号'))));
              const isZipCode = (apiConfig && apiConfig.isZip) || (q.title && (q.title.includes('郵便番号') || q.title.toLowerCase().includes('zip')));
              const isAccountHolderKana = isAccountHolderKanaField(q);

              if (isBankCode) {
                input.placeholder = '4桁の金融機関コード (例: 0005)';
              } else if (isBranchCode) {
                input.placeholder = '3桁の支店番号 (例: 001)';
              } else if (isZipCode) {
                input.placeholder = '例: 100-0001 または 1000001';
                input.maxLength = 8;
              } else if (isAccountHolderKana) {
                input.placeholder = '例: カ）ヤマダ タロウ';
              }

              let zipLookupTimer = null;
              input.addEventListener('input', (e) => {
                let curVal = e.target.value;

                if (isAccountHolderKana) {
                  const converted = convertHiraganaToKatakana(curVal);
                  if (converted !== curVal) {
                    curVal = converted;
                    input.value = curVal;
                  }
                  if (curVal.trim() && curVal.trim() !== '-') {
                    if (!ACCOUNT_HOLDER_KANA_REGEX.test(curVal)) {
                      showError(q.id, '口座名義はカナと（）.のみで入力してください（例: カ）ヤマダ タロウ）。');
                    } else {
                      clearError(q.id);
                    }
                  } else {
                    clearError(q.id);
                  }
                }

                formValues[q.id] = curVal;
                if (!isAccountHolderKana) clearError(q.id);

                if (isBankCode && curVal.trim().length === 4) {
                  const b = findBankByCode(curVal.trim());
                  if (b) {
                    autoFillBankNameInView(b.name);
                  }
                } else if (isBranchCode && curVal.trim().length === 3) {
                  const currentBankName = getSelectedBankNameInView();
                  const b = findBankByName(currentBankName);
                  if (b) {
                    if (b.branches) {
                      for (const [brName, brCode] of Object.entries(b.branches)) {
                        if (brCode === curVal.trim()) {
                          autoFillBranchNameInView(brName);
                          break;
                        }
                      }
                    }
                    BankDataService.getBranches(b.code).then(branches => {
                      const cleanBc = curVal.trim();
                      if (branches && branches[cleanBc]) {
                        autoFillBranchNameInView(branches[cleanBc].name);
                      }
                    }).catch(() => {});
                  }
                } else if (isZipCode) {
                  const cleanZip = curVal.replace(/[^\d]/g, '');
                  if (cleanZip.length === 7) {
                    clearTimeout(zipLookupTimer);
                    zipLookupTimer = setTimeout(async () => {
                      const addr = await lookupAddressFromZip(cleanZip);
                      if (addr) {
                        autoFillAddressFromZipInView(addr);
                      }
                    }, 100);
                  }
                }
              });

              if (isAccountHolderKana) {
                input.addEventListener('blur', () => {
                  const val = input.value.trim();
                  if (val && val !== '-') {
                    if (!ACCOUNT_HOLDER_KANA_REGEX.test(val)) {
                      showError(q.id, '口座名義はカナと（）.のみで入力してください（例: カ）ヤマダ タロウ）。');
                    } else {
                      clearError(q.id);
                    }
                  }
                });
              }

              container.appendChild(input);

              // 法人名・屋号または自動ハイフン補填規則がある場合、個人事業主向けの案内文を表示
              if ((q.validation && q.validation.condition === 'auto_hyphen') || (q.title && (q.title.includes('法人名') || q.title.includes('屋号')) && !q.title.includes('カナ') && !q.title.includes('フリガナ') && !q.title.includes('ふりがな'))) {
                const hint = document.createElement('div');
                hint.className = 'auto-hyphen-hint';
                hint.style.cssText = 'font-size: 0.8rem; color: var(--color-text-muted); margin-top: 6px; line-height: 1.4;';
                hint.innerHTML = '💡 <span style="font-weight: 500;">個人事業主の方へ</span>: 屋号がない場合は未入力のまま「次へ」へお進みください。';
                container.appendChild(hint);
              }
            }
          } else if (q.type === 'paragraph') {
            const textarea = document.createElement('textarea');
            textarea.className = 'form-control';
            textarea.placeholder = '回答を入力...';
            textarea.value = val || '';
            textarea.addEventListener('input', (e) => {
              formValues[q.id] = e.target.value;
              clearError(q.id);
            });
            container.appendChild(textarea);
          } else if (['radio', 'checkbox'].includes(q.type)) {
            const list = document.createElement('div');
            list.className = 'options-list';
            const options = q.options || [];

            options.forEach((opt, oIdx) => {
              const label = document.createElement('label');
              label.className = 'option-label';

              const input = document.createElement('input');
              input.type = q.type;
              input.name = `opt_${q.id}`;
              input.value = opt.label;

              if (q.type === 'radio') {
                input.checked = val === opt.label;
                if (input.checked) label.classList.add('selected');
              } else {
                input.checked = Array.isArray(val) && val.includes(opt.label);
                if (input.checked) label.classList.add('selected');
              }

              input.addEventListener('change', () => {
                if (q.scrollRequired) {
                  formValues[q.id + '_scrolled'] = true;
                }
                if (q.type === 'radio') {
                  formValues[q.id] = opt.label;
                  list.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
                  label.classList.add('selected');
                  // ラジオ変更で次のアクションが変わる可能性があるので更新
                  const section = formDefinition.sections.find(s => s.id === currentSectionId);
                  if (section) updateNavButtons(section);
                } else {
                  if (!Array.isArray(formValues[q.id])) formValues[q.id] = [];
                  if (input.checked) {
                    formValues[q.id].push(opt.label);
                    label.classList.add('selected');
                  } else {
                    formValues[q.id] = formValues[q.id].filter(v => v !== opt.label);
                    label.classList.remove('selected');
                  }
                }
                clearError(q.id);
              });

              label.appendChild(input);
              const textSpan = document.createElement('span');
              textSpan.textContent = opt.label;
              label.appendChild(textSpan);
              list.appendChild(label);
            });
            container.appendChild(list);
          } else if (q.type === 'select') {
            const select = document.createElement('select');
            select.className = 'form-control';
            const defaultOpt = document.createElement('option');
            defaultOpt.value = '';
            defaultOpt.textContent = '選択してください';
            select.appendChild(defaultOpt);

            (q.options || []).forEach(opt => {
              const optEl = document.createElement('option');
              optEl.value = opt.label;
              optEl.textContent = opt.label;
              if (val === opt.label) optEl.selected = true;
              select.appendChild(optEl);
            });

            select.addEventListener('change', (e) => {
              formValues[q.id] = e.target.value;
              clearError(q.id);
              const section = formDefinition.sections.find(s => s.id === currentSectionId);
              if (section) updateNavButtons(section);
            });
            container.appendChild(select);
          } else if (q.type === 'password') {
            const pwWrapper = document.createElement('div');
            pwWrapper.style.display = 'flex';
            pwWrapper.style.flexDirection = 'column';
            pwWrapper.style.gap = '8px';

            const input1 = document.createElement('input');
            input1.type = 'password';
            input1.className = 'form-control';
            input1.placeholder = 'パスワードを入力...';
            input1.value = val || '';
            input1.addEventListener('input', (e) => {
              formValues[q.id] = e.target.value;
              clearError(q.id);
            });

            const input2 = document.createElement('input');
            input2.type = 'password';
            input2.className = 'form-control';
            input2.placeholder = '確認用パスワードを再入力...';
            input2.value = formValues[q.id + '_confirm'] || '';
            input2.addEventListener('input', (e) => {
              formValues[q.id + '_confirm'] = e.target.value;
              clearError(q.id);
            });

            pwWrapper.appendChild(input1);
            pwWrapper.appendChild(input2);
            container.appendChild(pwWrapper);
          } else if (q.type === 'file') {
            const fileBox = document.createElement('div');
            fileBox.style.padding = '16px';
            fileBox.style.border = '2px dashed var(--color-border)';
            fileBox.style.borderRadius = '6px';
            fileBox.style.textAlign = 'center';
            fileBox.style.background = '#f8f9fa';

            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.style.display = 'none';

            const fileBtn = document.createElement('button');
            fileBtn.type = 'button';
            fileBtn.className = 'btn btn-secondary';
            fileBtn.textContent = '📁 ファイルを選択';
            fileBtn.addEventListener('click', () => fileInput.click());

            const fileStatus = document.createElement('div');
            fileStatus.style.fontSize = '0.82rem';
            fileStatus.style.color = 'var(--color-text-muted)';
            fileStatus.style.marginTop = '8px';
            fileStatus.textContent = val ? `選択済み: ${val}` : 'ファイルが選択されていません';

            fileInput.addEventListener('change', (e) => {
              if (e.target.files && e.target.files[0]) {
                const file = e.target.files[0];
                formValues[q.id] = file.name;
                fileStatus.textContent = `選択済み: ${file.name} (${Math.round(file.size / 1024)} KB)`;
                clearError(q.id);
              }
            });

            fileBox.appendChild(fileBtn);
            fileBox.appendChild(fileInput);
            fileBox.appendChild(fileStatus);
            container.appendChild(fileBox);
          }
        }

        function showError(questionId, message) {
          const card = document.querySelector(`.question-card[data-question-id="${questionId}"]`);
          if (card) {
            card.classList.add('has-error');
            const errEl = card.querySelector('.error-text');
            if (errEl) errEl.textContent = message || '入力内容に不備があります。';
          }
        }

        function clearError(questionId) {
          const card = document.querySelector(`.question-card[data-question-id="${questionId}"]`);
          if (card) {
            card.classList.remove('has-error');
            const errEl = card.querySelector('.error-text');
            if (errEl) errEl.textContent = '';
          }
        }

        // ==========================================
        // 6. 入力バリデーション
        // ==========================================
        // ==========================================
        // 6. 入力バリデーション & 自動補填
        // ==========================================
        // 未入力時に自動で半角ハイフン「-」を補填する処理（個人事業の屋号なし等）
        function autoFillHyphenForEmptyFields(section) {
          if (!section || !section.questions) return;

          // 1. 法人名・屋号の質問状況をチェック（当セクションまたは全セクション）
          let isSoleProprietorNoTrade = false;
          if (formDefinition && formDefinition.sections) {
            formDefinition.sections.forEach(s => {
              (s.questions || []).forEach(q => {
                const isCorp = q.title && (q.title.includes('法人名') || q.title.includes('屋号')) &&
                               !q.title.includes('カナ') && !q.title.includes('フリガナ') && !q.title.includes('ふりがな');
                if (isCorp) {
                  const val = formValues[q.id];
                  if (val === undefined || val === null || (typeof val === 'string' && val.trim() === '') || val === '-') {
                    isSoleProprietorNoTrade = true;
                    formValues[q.id] = '-';
                    const card = document.querySelector(`.question-card[data-question-id="${q.id}"]`);
                    if (card) {
                      const input = card.querySelector('input.form-control, textarea.form-control');
                      if (input) input.value = '-';
                      card.classList.remove('has-error');
                    }
                  }
                }
              });
            });
          }

          // 2. セクション内の質問に対する補填処理
          section.questions.forEach(q => {
            const isAutoHyphenRule = q.validation && (q.validation.condition === 'auto_hyphen' || q.validation.autoHyphen);
            const isKanaField = q.title && (q.title.includes('カナ') || q.title.includes('フリガナ') || q.title.includes('ふりがな'));

            // 個人事業で屋号がない場合はカナ欄も自動で半角ハイフン「-」を補填してエラーにならないようにする
            if (isAutoHyphenRule || (isKanaField && isSoleProprietorNoTrade)) {
              const curVal = formValues[q.id];
              const isEmpty = curVal === undefined || curVal === null || (typeof curVal === 'string' && curVal.trim() === '');
              if (isEmpty) {
                formValues[q.id] = '-';
                const card = document.querySelector(`.question-card[data-question-id="${q.id}"]`);
                if (card) {
                  const input = card.querySelector('input.form-control, textarea.form-control');
                  if (input) input.value = '-';
                  card.classList.remove('has-error');
                }
              }
            }
          });
        }

        function validateCurrentSection() {
          const section = formDefinition.sections.find(s => s.id === currentSectionId);
          if (!section) return true;

          // 未入力ハイフン自動補填をバリデーション前に実行（必須チェック通過のため）
          autoFillHyphenForEmptyFields(section);

          let isValid = true;
          let firstErrorCard = null;

          (section.questions || []).forEach(q => {
            const card = document.querySelector(`.question-card[data-question-id="${q.id}"]`);
            if (!card) return;

            // セクション内スキップで非表示または非活性になっている質問は検証をスキップ
            if (card.style.display === 'none' || card.classList.contains('q-card-disabled')) {
              return;
            }

            const errorTextEl = card.querySelector('.error-text');
            card.classList.remove('has-error');

            // 1. スクロール同意チェック
            if (q.scrollRequired && !formValues[q.id + '_scrolled']) {
              card.classList.add('has-error');
              if (errorTextEl) errorTextEl.textContent = '規約内容を最下部までスクロールしてご確認ください。';
              isValid = false;
              if (!firstErrorCard) firstErrorCard = card;
              return;
            }

            const val = formValues[q.id];

            // 2. 必須チェック
            if (q.required) {
              let isEmpty = false;
              if (val === undefined || val === null || val === '') {
                isEmpty = true;
              } else if (Array.isArray(val) && val.length === 0) {
                isEmpty = true;
              }

              if (isEmpty) {
                card.classList.add('has-error');
                const isKana = q.title && (q.title.includes('カナ') || q.title.includes('フリガナ') || q.title.includes('ふりがな'));
                if (errorTextEl) {
                  errorTextEl.textContent = isKana ? 'カナの登録がない法人のため、フリガナを入力してください。' : 'この質問は必須項目です。';
                }
                isValid = false;
                if (!firstErrorCard) firstErrorCard = card;
                return;
              }
            }

            // 2-2. 屋号とカナの連動チェック（個人・個人事業主）
            const isTradeKanaField = (q.dataKey === 'company_kana' && (q.title || '').includes('屋号')) ||
                                     ((q.title || '').includes('屋号') && ((q.title || '').includes('カナ') || (q.title || '').includes('フリガナ')));
            if (isTradeKanaField) {
              const tradeQ = (section.questions || []).find(cq => (cq.dataKey === 'company_name' && (cq.title || '').includes('屋号')) ||
                                                                  ((cq.title || '').includes('屋号') && !(cq.title || '').includes('カナ') && !(cq.title || '').includes('フリガナ')));
              const tradeVal = tradeQ && formValues[tradeQ.id] ? String(formValues[tradeQ.id]).trim() : '';
              const isTradeEntered = tradeVal !== '' && tradeVal !== '-';
              const isKanaEmpty = val === undefined || val === null || (typeof val === 'string' && val.trim() === '') || val === '-';

              if (isTradeEntered && isKanaEmpty) {
                card.classList.add('has-error');
                if (errorTextEl) errorTextEl.textContent = '屋号を入力された場合は、屋号のカナ（全角カタカナ）を入力してください。';
                isValid = false;
                if (!firstErrorCard) firstErrorCard = card;
                return;
              } else if (!isTradeEntered && isKanaEmpty) {
                // 屋号が未入力の場合はカナも空でOK、エラーにしない
                clearError(q.id);
              }
            }

            // 2-3. 法人名カナ入力必須チェック
            const isCorpKanaField = (q.dataKey === 'company_kana' && !(q.title || '').includes('屋号')) ||
                                    (!isTradeKanaField && q.title && (q.title.includes('法人名') && (q.title.includes('カナ') || q.title.includes('フリガナ'))));
            if (isCorpKanaField) {
              const corpQ = (section.questions || []).find(cq => (cq.dataKey === 'company_name' && !(cq.title || '').includes('屋号')) ||
                                                                 (cq.title && cq.title.includes('法人名') && !cq.title.includes('カナ') && !cq.title.includes('フリガナ')));
              const corpVal = corpQ && formValues[corpQ.id] ? String(formValues[corpQ.id]).trim() : '';
              const isCorpEntered = corpVal !== '' && corpVal !== '-';
              const isKanaEmpty = val === undefined || val === null || (typeof val === 'string' && val.trim() === '') || val === '-';

              if (isCorpEntered && isKanaEmpty) {
                card.classList.add('has-error');
                if (errorTextEl) errorTextEl.textContent = 'カナの登録がない法人のため、フリガナを入力してください。';
                isValid = false;
                if (!firstErrorCard) firstErrorCard = card;
                return;
              }
            }

            // 2-4. 町名・番地入力時の番地（数字）未入力防止チェック
            const isStreetAddressField = (q.dataKey === 'street') ||
              (((q.title || '').includes('町名') || (q.title || '').includes('番地')) && !(q.title || '').includes('建物'));
            if (isStreetAddressField && val && typeof val === 'string' && val.trim() !== '' && val.trim() !== '-') {
              const hasDigits = /[0-9０-９]/.test(val);
              if (!hasDigits) {
                card.classList.add('has-error');
                if (errorTextEl) errorTextEl.textContent = '番地・号（数字）まで正しく入力してください。町域のみでは送信できません。';
                isValid = false;
                if (!firstErrorCard) firstErrorCard = card;
                return;
              }
            }

            // 2-5. 税務区分「インボイス登録事業者である。」選択時の番号必須チェック
            const isInvNumField = (q.dataKey === 'invoice_number') ||
              ((q.title || '').includes('インボイス') && ((q.title || '').includes('番号') || (q.title || '').includes('登録')));
            if (isInvNumField) {
              const taxQ = (section.questions || []).find(cq => cq.dataKey === 'tax_invoice_status' || (cq.title || '').includes('税務区分') || (cq.title || '').includes('インボイス登録状況'));
              if (taxQ) {
                const taxVal = formValues[taxQ.id];
                if (taxVal !== 'インボイス登録事業者である。') {
                  // 非課税事業者または未登録課税事業者はインボイス番号の入力不要
                  clearError(q.id);
                  return;
                }
                // インボイス登録事業者の場合は番号必須
                if (!val || typeof val !== 'string' || val.trim() === '' || val.trim() === '-') {
                  card.classList.add('has-error');
                  if (errorTextEl) errorTextEl.textContent = '「インボイス登録事業者である。」を選択された場合は、インボイス登録番号（T+13桁）を入力してください。';
                  isValid = false;
                  if (!firstErrorCard) firstErrorCard = card;
                  return;
                }
              }
            }

            // 3. パスワード一致チェック
            if (q.type === 'password' && val) {
              const confirmVal = formValues[q.id + '_confirm'];
              if (val !== confirmVal) {
                card.classList.add('has-error');
                if (errorTextEl) errorTextEl.textContent = 'パスワードが一致しません。';
                isValid = false;
                if (!firstErrorCard) firstErrorCard = card;
                return;
              }
            }

            // 4. バリデーションルールチェック
            if (val && typeof val === 'string') {
              const isAccountHolderKana = isAccountHolderKanaField(q);
              if (isAccountHolderKana && val.trim() !== '-') {
                if (!ACCOUNT_HOLDER_KANA_REGEX.test(val.trim())) {
                  card.classList.add('has-error');
                  if (errorTextEl) errorTextEl.textContent = '口座名義はカナと（）.のみで入力してください（例: カ）ヤマダ タロウ）。';
                  isValid = false;
                  if (!firstErrorCard) firstErrorCard = card;
                  return;
                }
              }

              if (q.validation) {
                const v = q.validation;
                let rulePassed = true;
                if (val.trim() === '-') {
                  rulePassed = true; // 自動補填された半角ハイフン「-」は全ルール通過
                } else if (v.category === 'text') {
                  if (v.condition === 'email') {
                    rulePassed = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
                  } else if (v.condition === 'url') {
                    rulePassed = /^https?:\/\/[^\s]+$/.test(val);
                  } else if (v.condition === 'auto_hyphen') {
                    rulePassed = true; // 自動ハイフン補填規則は形式問わずパス
                  }
                } else if (v.category === 'number') {
                  const num = Number(val);
                  if (isNaN(num)) rulePassed = false;
                } else if (v.category === 'regex' && v.value) {
                  try {
                    const reg = new RegExp(v.value);
                    rulePassed = reg.test(val);
                  } catch (e) {
                    console.error('Regex validation error:', e);
                  }
                } else if (v.category === 'api') {
                  if (v.condition === 'corp_name') {
                    rulePassed = val.trim().length > 0;
                  } else if (v.condition === 'invoice_number') {
                    if (val.trim() === '-') {
                      rulePassed = true;
                    } else {
                      const cleanInv = val.trim().toUpperCase();
                      rulePassed = /^T\d{13}$/.test(cleanInv) && (CORP_DATABASE.some(c => ('T' + c.num) === cleanInv) || isValidInvoiceCheckDigit(cleanInv));
                    }
                  } else if (v.condition === 'zip_code' || v.condition === 'zip') {
                    const cleanZip = val.replace(/[^\d]/g, '');
                    rulePassed = cleanZip.length === 7;
                  } else if (v.condition === 'bank_name') {
                    rulePassed = val.trim().length > 0;
                  } else if (v.condition === 'branch_name') {
                    rulePassed = val.trim().length > 0;
                  }
                }

                if (!rulePassed) {
                  card.classList.add('has-error');
                  if (errorTextEl) errorTextEl.textContent = v.errorMessage || '正しい形式で入力してください。';
                  isValid = false;
                  if (!firstErrorCard) firstErrorCard = card;
                  return;
                }
              }
            }
          });

          if (!isValid) {
            if (firstErrorCard) {
              firstErrorCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            showToast('⚠️ 未入力の必須項目、またはご確認が必要な項目があります');
          }
          return isValid;
        }
        window.validateCurrentSection = validateCurrentSection;

        // ==========================================
        // 7. 画面遷移 & 送信処理
        // ==========================================
        function hideIntermediateStep() {
          if (partialSubmitContainerEl) {
            partialSubmitContainerEl.style.display = 'none';
            partialSubmitContainerEl.innerHTML = '';
          }
          questionsContainerEl.style.display = 'flex';
          const actionRow = document.querySelector('.action-buttons-row');
          if (actionRow) actionRow.style.display = 'flex';
        }

        function isSectionPartialSubmit(section) {
          if (!section) return false;
          if (section.nextAction === 'partial_submit') return true;
          const questions = section.questions || [];
          for (const q of questions) {
            if (['radio', 'select'].includes(q.type)) {
              const val = formValues[q.id];
              if (val) {
                const opt = (q.options || []).find(o => o.label === val);
                if (opt && opt.nextSectionId === 'partial_submit') return true;
              }
            }
          }
          return false;
        }

        function getResolvedNextSection(section) {
          const sections = formDefinition.sections || [];
          const curIdx = sections.findIndex(s => s.id === section.id);

          const questions = section.questions || [];
          for (const q of questions) {
            if (['radio', 'select'].includes(q.type)) {
              const val = formValues[q.id];
              if (val) {
                const opt = (q.options || []).find(o => o.label === val);
                if (opt && opt.nextSectionId && opt.nextSectionId !== 'partial_submit') {
                  if (opt.nextSectionId === 'submit') return null;
                  const targetSec = sections.find(s => s.id === opt.nextSectionId);
                  if (targetSec) return targetSec;
                }
              }
            }
          }

          const act = section.nextAction;
          if (act && !['next', 'partial_submit', 'submit'].includes(act)) {
            const targetSec = sections.find(s => s.id === act);
            if (targetSec) return targetSec;
          }

          if (curIdx !== -1 && curIdx < sections.length - 1) {
            return sections[curIdx + 1];
          }
          return null;
        }

        function getQuestionTypeLabel(type) {
          const map = {
            'text': '📝 1行テキスト',
            'paragraph': '📄 長文記述',
            'radio': '🔘 選択式（単一）',
            'checkbox': '☑ 選択式（複数）',
            'select': '🔽 プルダウン選択',
            'file': '📎 ファイル添付（画像・PDF等）',
            'password': '🔑 パスワード',
            'number': '🔢 数値入力',
            'date': '📅 日付',
            'email': '✉️ メールアドレス',
            'tel': '📞 電話番号'
          };
          return map[type] || '✏️ 入力項目';
        }

        function showIntermediatePartialSubmitStep(currentSec, nextSec) {
          if (!partialSubmitContainerEl) return;

          questionsContainerEl.style.display = 'none';
          const actionRow = document.querySelector('.action-buttons-row');
          if (actionRow) actionRow.style.display = 'none';
          if (sectionInfoCardEl) sectionInfoCardEl.style.display = 'none';

          const sections = formDefinition.sections || [];
          const curIdx = sections.findIndex(s => s.id === currentSec.id);
          const nextIdx = sections.findIndex(s => s.id === nextSec.id);

          if (sections.length > 1) {
            progressContainerEl.style.display = 'flex';
            const progress = Math.round(((curIdx + 1) / sections.length) * 100);
            progressBarFillEl.style.width = `${progress}%`;

          let questionsListHtml = '';
          if (nextQuestions.length === 0) {
            questionsListHtml = `
              <div style="padding: 14px; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; color: #64748b; font-size: 0.85rem; text-align: center;">
                このセクションに入力項目はありません（案内・確認セクションです）
              </div>
            `;
          } else {
            questionsListHtml = nextQuestions.map((q, qIndex) => {
              const reqBadge = q.required 
                ? '<span style="background: #fee2e2; color: #dc2626; padding: 2px 6px; border-radius: 4px; font-size: 0.72rem; font-weight: 700;">必須</span>' 
                : '<span style="background: #f1f5f9; color: #64748b; padding: 2px 6px; border-radius: 4px; font-size: 0.72rem; font-weight: 600;">任意</span>';
              const typeLabel = getQuestionTypeLabel(q.type);
              const descHtml = q.description 
                ? `<div style="font-size: 0.78rem; color: #64748b; margin-top: 4px; line-height: 1.4;">${renderRichTextWithLinks(q.description)}</div>` 
                : '';

              return `
                <div class="next-sec-q-item" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);">
                  <div style="flex: 1;">
                    <div style="font-size: 0.9rem; font-weight: 600; color: #1e293b; display: flex; align-items: baseline; gap: 6px;">
                      <span style="color: #64748b; font-size: 0.8rem; font-weight: 700;">Q${qIndex + 1}.</span>
                      <span>${escapeHtml(q.title || '無題の質問')}</span>
                    </div>
                    ${descHtml}
                  </div>
                  <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0;">
                    ${reqBadge}
                    <span style="font-size: 0.72rem; color: #475569; background: #f8fafc; border: 1px solid #cbd5e1; padding: 1px 6px; border-radius: 4px; white-space: nowrap;">${typeLabel}</span>
                  </div>
                </div>
              `;
            }).join('');
          }

          const nextSecTitle = nextSec.title || `セクション ${nextIdx + 1}`;
          const nextSecDesc = nextSec.description ? renderRichTextWithLinks(nextSec.description) : '';

          partialSubmitContainerEl.innerHTML = `
            <div class="partial-step-card" style="background: #ffffff; border: 1px solid var(--color-border); border-radius: var(--border-radius); padding: 28px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
              <div style="text-align: center; margin-bottom: 24px;">
                <div style="display: inline-flex; align-items: center; gap: 6px; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; font-size: 0.8rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; margin-bottom: 10px;">
                  <span>✓</span> セクション ${curIdx + 1} の入力が完了しました
                </div>
                <h2 style="font-size: 1.35rem; font-weight: 700; color: var(--color-text-main); margin: 0 0 8px;">進め方をご確認ください</h2>
                <p style="font-size: 0.88rem; color: var(--color-text-muted); margin: 0; line-height: 1.6;">
                  このフォームは<strong>「途中送信」</strong>に対応しています。<br>
                  次のセクションで入力する内容をご確認の上、<strong>「このまま次へ進む」</strong>か<strong>「ここで途中送信して再開リンクを発行する」</strong>かをお選びいただけます。
                </p>
              </div>

              <!-- 次のセクションで入力する情報のご確認 -->
              <div style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 20px; margin-bottom: 24px;">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 6px;">
                  <span style="font-size: 0.78rem; font-weight: 700; color: #0284c7; background: #e0f2fe; padding: 2px 8px; border-radius: 4px;">
                    📋 次のセクションで入力する情報
                  </span>
                  <span style="font-size: 0.75rem; color: #64748b;">
                    全 ${nextQuestions.length} 項目
                  </span>
                </div>
                <h3 style="font-size: 1.1rem; font-weight: 700; color: #1e293b; margin: 0 0 6px;">
                  【セクション ${nextIdx + 1}】 ${escapeHtml(nextSecTitle)}
                </h3>
                ${nextSecDesc ? `<div style="font-size: 0.82rem; color: #64748b; margin-bottom: 14px; line-height: 1.5;">${nextSecDesc}</div>` : ''}

                <div style="margin-top: 14px;">
                  <div style="font-size: 0.8rem; font-weight: 700; color: #334155; margin-bottom: 8px; display: flex; align-items: center; gap: 4px;">
                    <span>▼</span> 入力・添付が必要な項目一覧
                  </div>
                  <div style="max-height: 280px; overflow-y: auto; padding-right: 4px;">
                    ${questionsListHtml}
                  </div>
                </div>
              </div>

              <!-- 進め方の選択UI -->
              <div style="margin-top: 20px;">
                <div style="font-size: 0.92rem; font-weight: 700; color: #1e293b; margin-bottom: 12px; text-align: center;">
                  どちらの進め方にしますか？
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px;">
                  <!-- 選択肢A: 途中送信する -->
                  <div id="btn-choice-partial-submit" style="background: #ffffff; border: 2px solid #3b82f6; border-radius: 8px; padding: 18px 16px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 6px rgba(59,130,246,0.1);">
                    <div>
                      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                        <span style="font-size: 1.4rem;">💾</span>
                        <div style="font-size: 0.95rem; font-weight: 700; color: #1d4ed8;">ここまでの内容で途中送信する</div>
                      </div>
                      <div style="font-size: 0.78rem; color: #4b5563; line-height: 1.5; margin-bottom: 14px;">
                        手元に書類や情報がない場合におすすめです。これまでの回答を安全に保存し、<strong>8桁の確定登録コード</strong>と<strong>後からいつでも再開できる専用URL</strong>を発行します。
                      </div>
                    </div>
                    <button type="button" class="btn btn-primary" style="width: 100%; justify-content: center; font-size: 0.85rem; font-weight: 700; padding: 10px; background: #2563eb !important; border-color: #2563eb !important; cursor: pointer;">
                      💾 途中送信して再開URLを発行
                    </button>
                  </div>

                  <!-- 選択肢B: 次に進む -->
                  <div id="btn-choice-continue-next" style="background: #ffffff; border: 2px solid #10b981; border-radius: 8px; padding: 18px 16px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 6px rgba(16,185,129,0.1);">
                    <div>
                      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                        <span style="font-size: 1.4rem;">👉</span>
                        <div style="font-size: 0.95rem; font-weight: 700; color: #047857;">このまま次のセクションに進む</div>
                      </div>
                      <div style="font-size: 0.78rem; color: #4b5563; line-height: 1.5; margin-bottom: 14px;">
                        必要な情報や添付書類が手元に揃っている場合は、このまま続けて【${escapeHtml(nextSecTitle)}】の入力画面へ進んで回答を継続できます。
                      </div>
                    </div>
                    <button type="button" class="btn btn-success" style="width: 100%; justify-content: center; font-size: 0.85rem; font-weight: 700; padding: 10px; background: #059669 !important; border-color: #059669 !important; cursor: pointer;">
                      👉 このまま続けて回答する
                    </button>
                  </div>
                </div>

                <!-- 戻るボタン -->
                <div style="margin-top: 18px; text-align: center;">
                  <button type="button" id="btn-choice-back-to-sec" class="btn btn-secondary btn-sm" style="font-size: 0.8rem; color: #64748b; background: transparent; border: 1px solid #cbd5e1; cursor: pointer;">
                    ← 前のセクションの入力内容を修正する
                  </button>
                </div>
              </div>
            </div>
          `;

          partialSubmitContainerEl.style.display = 'flex';
          window.scrollTo({ top: 0, behavior: 'smooth' });

          const partialChoiceCard = partialSubmitContainerEl.querySelector('#btn-choice-partial-submit');
          if (partialChoiceCard) {
            partialChoiceCard.onclick = (e) => {
              e.preventDefault();
              hideIntermediateStep();
              submitForm(true);
            };
          }

          const continueChoiceCard = partialSubmitContainerEl.querySelector('#btn-choice-continue-next');
          if (continueChoiceCard) {
            continueChoiceCard.onclick = (e) => {
              e.preventDefault();
              hideIntermediateStep();
              sectionHistory.push(currentSectionId);
              currentSectionId = nextSec.id;
              renderCurrentSection();
            };
          }

          const backBtn = partialSubmitContainerEl.querySelector('#btn-choice-back-to-sec');
          if (backBtn) {
            backBtn.onclick = (e) => {
              e.preventDefault();
              hideIntermediateStep();
              renderCurrentSection();
            };
          }
        }

        btnNext.addEventListener('click', () => {
          if (!validateCurrentSection()) return;

          const section = formDefinition.sections.find(s => s.id === currentSectionId);
          if (!section) return;

          // 途中送信が設定されているセクション完了時の割り込み判定
          if (isSectionPartialSubmit(section)) {
            const nextSec = getResolvedNextSection(section);
            if (nextSec) {
              showIntermediatePartialSubmitStep(section, nextSec);
              return;
            }
          }

          const nextAction = getSectionNextAction(section);
          if (nextAction === 'submit') {
            submitForm();
          } else {
            sectionHistory.push(currentSectionId);
            currentSectionId = nextAction;
            renderCurrentSection();
          }
        });

        btnPrev.addEventListener('click', () => {
          if (sectionHistory.length > 0) {
            currentSectionId = sectionHistory.pop();
            renderCurrentSection();
          }
        });

        btnSubmit.addEventListener('click', () => {
          if (!validateCurrentSection()) return;
          submitForm();
        });

        function submitForm(forcePartial = null) {
          const section = formDefinition.sections.find(s => s.id === currentSectionId);
          const nextAction = section ? getSectionNextAction(section) : 'submit';
          const isPartial = forcePartial !== null ? forcePartial : (nextAction === 'partial_submit');

          const submitData = {};
          formDefinition.sections.forEach(s => {
            (s.questions || []).forEach(q => {
              if (formValues[q.id] !== undefined && formValues[q.id] !== '') {
                const key = q.dataKey || q.title || q.id;
                submitData[key] = formValues[q.id];
                if (q.title && q.title !== key) {
                  submitData[q.title] = formValues[q.id];
                }
              }
            });
          });

          console.log('[Form Submit] Submitted data:', submitData);

          const rowId = window.currentResumeRowId || ('row_' + Date.now());
          window.currentResumeRowId = rowId;
          let confirmedCode = window.currentRegistrationCode;
          if (!confirmedCode) {
            confirmedCode = String(Math.floor(10000000 + Math.random() * 90000000));
            window.currentRegistrationCode = confirmedCode;
          }

          // 次のセクション特定
          let nextSecId = null;
          const curIdx = formDefinition.sections.findIndex(s => s.id === currentSectionId);
          if (curIdx !== -1 && curIdx < formDefinition.sections.length - 1) {
            nextSecId = formDefinition.sections[curIdx + 1].id;
          }

          // 再開用URL生成（確実に view.html を指すように）
          const currentUrl = new URL(window.location.href);
          currentUrl.searchParams.set('res_id', rowId);
          if (nextSecId) currentUrl.searchParams.set('resumeSec', nextSecId);
          const resumeUrl = currentUrl.toString();

          // ドラフト保存
          try {
            localStorage.setItem('form_draft_' + rowId, JSON.stringify({
              rowId: rowId,
              registrationCode: confirmedCode,
              data: formValues,
              currentSectionId: currentSectionId,
              nextSectionId: nextSecId
            }));
          } catch(e) {}

          // 1. 親ウィンドウ (iframe) への postMessage 送信
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: 'FORM_SUBMIT',
              formTitle: formDefinition.title || '無題のフォーム',
              data: submitData,
              isTemporary: false,
              isPartialSubmit: isPartial,
              rowId: rowId,
              registrationCode: confirmedCode,
              currentSectionId: currentSectionId,
              nextSectionId: nextSecId
            }, '*');
          }

          // 2. ローカルストレージへの回答データ蓄積（スタンドアローン回答ログ）
          try {
            const formKey = `form_responses_${formDefinition.id || 'default'}`;
            const existing = JSON.parse(localStorage.getItem(formKey) || '[]');
            existing.push({
              submittedAt: new Date().toISOString(),
              data: submitData,
              isPartial: isPartial,
              registrationCode: confirmedCode
            });
            localStorage.setItem(formKey, JSON.stringify(existing));
          } catch(e) {}

          // 3. 完了画面表示
          const successTitle = document.getElementById('success-title');
          const successDesc = document.getElementById('success-desc');
          if (isPartial) {
            if (successTitle) successTitle.textContent = '途中送信が完了し、登録コードが確定しました！';
            if (successDesc) successDesc.innerHTML = `
              <div style="margin: 16px 0; background: rgba(49, 130, 206, 0.08); border: 1.5px solid #3182ce; border-radius: 8px; padding: 16px; text-align: center;">
                <div style="font-size: 0.85rem; font-weight: 700; color: #2b6cb0; margin-bottom: 6px;">【 確定登録コード 】</div>
                <div style="font-size: 1.6rem; font-weight: 800; letter-spacing: 2px; color: #2b6cb0; font-family: monospace;">${escapeHtml(confirmedCode)}</div>
                <div style="font-size: 0.75rem; color: #4a5568; margin-top: 4px;">入力内容が一時保存されました。続きのセクションは後からでもご回答いただけます。</div>
              </div>
              <div style="background: rgba(237, 242, 247, 0.7); border: 1px solid #cbd5e0; border-radius: 8px; padding: 12px; margin-bottom: 16px; text-align: left;">
                <div style="font-size: 0.8rem; font-weight: 700; color: #4a5568; margin-bottom: 4px;">🔗 再開用URL</div>
                <div style="display: flex; gap: 6px;">
                  <input type="text" id="resume-url-input" readonly value="${escapeHtml(resumeUrl)}" style="flex: 1; min-width: 0; box-sizing: border-box; font-size: 0.75rem; padding: 6px 8px; font-family: monospace; background: #fff; border: 1px solid #cbd5e0; border-radius: 4px;" onclick="this.select();" />
                  <button type="button" id="btn-copy-resume-url" class="btn btn-secondary btn-sm" style="font-size: 0.75rem; padding: 4px 12px; cursor: pointer; white-space: nowrap;">📋 コピー</button>
                </div>
                <div id="copy-resume-toast" style="display: none; font-size: 0.75rem; color: #16a34a; font-weight: 700; margin-top: 6px;">✓ 再開URLをコピーしました！</div>
              </div>
            `;

            const copyBtn = successDesc.querySelector('#btn-copy-resume-url');
            const toastEl = successDesc.querySelector('#copy-resume-toast');
            if (copyBtn) {
              copyBtn.onclick = () => {
                const input = successDesc.querySelector('#resume-url-input');
                const text = (input && input.value) ? input.value : resumeUrl;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(text).then(() => {
                    if (toastEl) {
                      toastEl.style.display = 'block';
                      setTimeout(() => { toastEl.style.display = 'none'; }, 2500);
                    }
                  }).catch(() => {
                    input.select();
                    document.execCommand('copy');
                    if (toastEl) {
                      toastEl.style.display = 'block';
                      setTimeout(() => { toastEl.style.display = 'none'; }, 2500);
                    }
                  });
                } else {
                  input.select();
                  document.execCommand('copy');
                  if (toastEl) {
                    toastEl.style.display = 'block';
                    setTimeout(() => { toastEl.style.display = 'none'; }, 2500);
                  }
                }
              };
            }
          } else {
            if (successTitle) successTitle.textContent = '回答を受け付けました';
            if (successDesc) successDesc.textContent = 'ご回答ありがとうございました。内容は正常に記録されました。';
          }

          // 4. 回答控えメールの自動送信（autoReply: true のメールアドレス項目宛て）
          try {
            let autoReplyEmail = null;
            formDefinition.sections.forEach(s => {
              (s.questions || []).forEach(q => {
                if (q.autoReply || q.sendCopy) {
                  const val = formValues[q.id];
                  if (val && typeof val === 'string' && val.includes('@')) {
                    autoReplyEmail = val.trim();
                  }
                }
              });
            });

            if (autoReplyEmail) {
              console.log('[AutoReply Mail] Sending response copy to:', autoReplyEmail);

              // メール本文HTMLの生成
              let questionsHtml = '<table style="width:100%; border-collapse:collapse; margin-top:16px; font-family:sans-serif; font-size:14px;">';
              questionsHtml += '<tr style="background:#f1f5f9; border-bottom:2px solid #cbd5e1;"><th style="padding:10px 12px; text-align:left; color:#334155; width:35%;">質問項目</th><th style="padding:10px 12px; text-align:left; color:#334155;">ご回答内容</th></tr>';
              
              formDefinition.sections.forEach(s => {
                (s.questions || []).forEach(q => {
                  const qVal = formValues[q.id];
                  if (qVal !== undefined && qVal !== null && qVal !== '') {
                    const displayVal = Array.isArray(qVal) ? qVal.join(', ') : String(qVal);
                    questionsHtml += `<tr style="border-bottom:1px solid #e2e8f0;"><td style="padding:10px 12px; color:#475569; font-weight:600; vertical-align:top; background:#fafafa;">${escapeHtml(q.title || '項目')}</td><td style="padding:10px 12px; color:#0f172a; white-space:pre-wrap; vertical-align:top;">${escapeHtml(displayVal)}</td></tr>`;
                  }
                });
              });
              questionsHtml += '</table>';

              const mailHtml = `
                <div style="font-family:sans-serif; max-width:640px; margin:0 auto; padding:24px; color:#1e293b; background:#ffffff; border:1px solid #e2e8f0; border-radius:8px;">
                  <div style="border-bottom:2px solid #3b82f6; padding-bottom:12px; margin-bottom:20px;">
                    <h2 style="margin:0 0 6px 0; color:#1e3a8a; font-size:20px;">${escapeHtml(formDefinition.title || 'フォーム回答控え')}</h2>
                    <p style="margin:0; font-size:13px; color:#64748b;">ご回答いただき誠にありがとうございました。以下の内容で受け付けいたしました。</p>
                  </div>
                  <div style="background:#f8fafc; padding:12px 16px; border-radius:6px; margin-bottom:16px; font-size:13px; color:#475569;">
                    <div><strong>受付日時:</strong> ${new Date().toLocaleString('ja-JP')}</div>
                    ${confirmedCode ? `<div><strong>受付番号:</strong> <span style="font-family:monospace; font-weight:700; color:#2563eb;">${escapeHtml(confirmedCode)}</span></div>` : ''}
                  </div>
                  <h3 style="font-size:15px; margin:20px 0 8px 0; color:#334155;">■ ご回答内容</h3>
                  ${questionsHtml}
                  <div style="margin-top:32px; padding-top:16px; border-top:1px solid #e2e8f0; font-size:12px; color:#94a3b8; text-align:center;">
                    ※本メールは送信控えとして自動配信されています。
                  </div>
                </div>
              `;

              fetch('/api/send-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  to: autoReplyEmail,
                  subject: `【${formDefinition.title || 'フォーム'}】ご回答内容の控え`,
                  html: mailHtml,
                  text: `ご回答ありがとうございました。\n\n【${formDefinition.title || 'フォーム'}】\n受付日時: ${new Date().toLocaleString('ja-JP')}\n\n※本メールは送信控えです。`
                })
              }).then(res => res.json()).then(data => {
                console.log('[AutoReply Mail Result]', data);
              }).catch(err => {
                console.warn('[AutoReply Mail Error]', err);
              });

              // 送信完了画面への案内文追加
              const autoreplyNotice = document.createElement('div');
              autoreplyNotice.style.cssText = 'margin: 16px 0; padding: 12px 16px; background: rgba(46, 125, 50, 0.08); border: 1.5px solid #2e7d32; border-radius: 8px; font-size: 0.85rem; color: #1e4620; text-align: center;';
              autoreplyNotice.innerHTML = `📨 ご入力いただいたメールアドレス（<strong>${escapeHtml(autoReplyEmail)}</strong>）宛てに、回答内容の控えを送信しました。`;
              if (successDesc) {
                successDesc.appendChild(autoreplyNotice);
              }
            }
          } catch(emailErr) {
            console.warn('[AutoReply Mail Warning]', emailErr);
          }

          formContainer.style.display = 'none';
          successCard.style.display = 'block';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        btnSubmitAnother.addEventListener('click', () => {
          successCard.style.display = 'none';
          formContainer.style.display = 'flex';
          initFormView();
        });

        // 起動
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadForm);
        } else {
          loadForm();
        }
      })();
    </script>
  </body>
</html>
